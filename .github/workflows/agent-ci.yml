name: Agent CI

on:
  push:
    branches: ["claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_llm:
        description: Run the live-provider agent tests (needs DEEPSEEK_API_KEY secret)
        type: boolean
        default: true
      apk_run_id:
        description: Reuse the APKs from this earlier run id and only run the emulator jobs
        type: string
        default: ""

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  ROBOLECTRIC_REPO: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  build:
    name: Build, unit tests, lint
    if: ${{ !inputs.apk_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/node_modules /usr/local/share/boost || true
          df -h /
      - name: Gradle memory limits for hosted runners
        run: |
          # Upstream gradle.properties asks for 12 GB + 8 GB daemons; hosted runners have 16 GB.
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx3g
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=3
          PROPS
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace
      - name: Assemble release APK (R8 minify + resource shrinking)
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace
      - name: Agent unit tests (live DeepSeek tests run when the secret is set)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -d composeApp/src/androidHostTest/kotlin/com/nuvio/app/agent ]; then
            ./gradlew :composeApp:testAndroidHostTest --tests 'com.nuvio.app.agent.*'
          else
            echo "No agent tests yet"
          fi
      - name: Full unit test suite (upstream failures are reported, not fatal)
        continue-on-error: true
        run: ./gradlew :composeApp:testAndroidHostTest --continue
      - name: Lint
        run: ./gradlew :androidApp:lintFullDebug
      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out/apk out/reports
          cp androidApp/build/outputs/apk/full/debug/*.apk out/apk/ 2>/dev/null || true
          cp androidApp/build/outputs/apk/full/release/*.apk out/apk/ 2>/dev/null || true
          cp androidApp/build/outputs/mapping/fullRelease/mapping.txt out/reports/ 2>/dev/null || true
          cp -r composeApp/build/reports/tests out/reports/unit-tests 2>/dev/null || true
          cp androidApp/build/reports/lint-results-fullDebug.* out/reports/ 2>/dev/null || true
          ls -la out/apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: out/apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: out/reports
          retention-days: 14

  emulator:
    # One job runs both variants on the same emulator: a second concurrent emulator job sat
    # queued for a runner and was cancelled after 15 minutes in every earlier run.
    name: Emulator (debug + release)
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.apk_run_id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    steps:
      - name: Free disk space
        # The emulator's userdata image, screen recordings and logcat filled the runner disk in
        # runs #20-#21 ("Free space left: 12 MB"), and the emulator died mid-run.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
          run-id: ${{ inputs.apk_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start local test addon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          nohup python3 scripts/test-addon/server.py --port 7000 --public-host 10.0.2.2 > test-addon.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:7000/manifest.json && break; sleep 1; done
      - name: Start scripted mock LLM server
        run: |
          nohup python3 scripts/mock-llm/server.py --port 8090 > mock-llm.log 2>&1 &
          sleep 2 && curl -sf localhost:8090/v1/models
      - name: Pick APKs
        id: apk
        run: |
          echo "debug=$(ls apks/*full-debug*.apk | head -1)" >> "$GITHUB_OUTPUT"
          echo "release=$(ls apks/*x86_64*release*.apk apks/*release*x86_64*.apk 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - name: Start host monitor
        # The emulator process died ~16 min into the release flows in runs #20-#22 with nothing in
        # its output; record host memory/disk/top processes to find out why.
        run: |
          mkdir -p flow-artifacts
          nohup bash -c 'while true; do date -u; free -m; df -h / | tail -1; ps -eo pid,rss,pcpu,comm --sort=-rss | head -6; echo; sleep 30; done' > flow-artifacts/host-monitor.log 2>&1 &
      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Debug runs the deterministic mock provider; release runs DeepSeek when the secret exists.
          RELEASE_AGENT_PROVIDER: ${{ secrets.DEEPSEEK_API_KEY != '' && 'deepseek' || 'mock' }}
          # qemu crashed during the 2nd-6th screenrecord of a run in #22-#25; keep screenshots only.
          AGENT_MAX_RECORDINGS: "0"
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # 4096M pushed qemu to ~6.1 GB RSS on the 7.9 GB runner; the host swapped and the emulator died (run #23).
          ram-size: 2560M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # A hardware keyboard keeps the soft keyboard from covering the tab bar and the assistant button.
          enable-hw-keyboard: true
          script: |
            bash scripts/ci/run-emulator-flows.sh "${{ steps.apk.outputs.release }}" release
            bash scripts/ci/run-emulator-flows.sh "${{ steps.apk.outputs.debug }}" debug
      - name: Host diagnostics
        if: always()
        run: |
          sudo dmesg -T | grep -iE "oom|killed process|qemu|out of memory" | tail -40 > flow-artifacts/host-dmesg.txt || true
          cat flow-artifacts/host-dmesg.txt
          tail -40 flow-artifacts/host-monitor.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence
          path: |
            flow-artifacts
            test-addon.log
            mock-llm.log
          retention-days: 14
