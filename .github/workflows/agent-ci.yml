name: Agent CI

on:
  push:
    branches: ["claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_llm:
        description: Run the live-provider agent tests (needs DEEPSEEK_API_KEY secret)
        type: boolean
        default: true

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  ROBOLECTRIC_REPO: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/node_modules /usr/local/share/boost || true
          df -h /
      - name: Gradle memory limits for hosted runners
        run: |
          # Upstream gradle.properties asks for 12 GB + 8 GB daemons; hosted runners have 16 GB.
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx3g
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=3
          PROPS
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace
      - name: Assemble release APK (R8 minify + resource shrinking)
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace
      - name: Agent unit tests (live DeepSeek tests run when the secret is set)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -d composeApp/src/androidHostTest/kotlin/com/nuvio/app/agent ]; then
            ./gradlew :composeApp:testAndroidHostTest --tests 'com.nuvio.app.agent.*'
          else
            echo "No agent tests yet"
          fi
      - name: Full unit test suite (upstream failures are reported, not fatal)
        continue-on-error: true
        run: ./gradlew :composeApp:testAndroidHostTest --continue
      - name: Lint
        run: ./gradlew :androidApp:lintFullDebug
      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out/apk out/reports
          cp androidApp/build/outputs/apk/full/debug/*.apk out/apk/ 2>/dev/null || true
          cp androidApp/build/outputs/apk/full/release/*.apk out/apk/ 2>/dev/null || true
          cp androidApp/build/outputs/mapping/fullRelease/mapping.txt out/reports/ 2>/dev/null || true
          cp -r composeApp/build/reports/tests out/reports/unit-tests 2>/dev/null || true
          cp androidApp/build/reports/lint-results-fullDebug.* out/reports/ 2>/dev/null || true
          ls -la out/apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: out/apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: out/reports
          retention-days: 14

  emulator:
    name: Emulator (${{ matrix.variant }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start local test addon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          nohup python3 scripts/test-addon/server.py --port 7000 --public-host 10.0.2.2 > test-addon.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:7000/manifest.json && break; sleep 1; done
      - name: Start scripted mock LLM server
        run: |
          nohup python3 scripts/mock-llm/server.py --port 8090 > mock-llm.log 2>&1 &
          sleep 2 && curl -sf localhost:8090/v1/models
      - name: Pick APK
        id: apk
        run: |
          if [ "${{ matrix.variant }}" = "debug" ]; then
            echo "path=$(ls apks/*full-debug*.apk | head -1)" >> "$GITHUB_OUTPUT"
            echo "package=com.nuviodebug.com" >> "$GITHUB_OUTPUT"
          else
            echo "path=$(ls apks/*x86_64*release*.apk apks/*release*x86_64*.apk 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
            echo "package=com.nuvio.app" >> "$GITHUB_OUTPUT"
          fi
      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APP_PACKAGE: ${{ steps.apk.outputs.package }}
          FLOW_OUT: flow-artifacts
          # Debug runs the deterministic mock provider; release runs DeepSeek when the secret exists.
          AGENT_PROVIDER: ${{ matrix.variant == 'release' && secrets.DEEPSEEK_API_KEY != '' && 'deepseek' || 'mock' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/run-emulator-flows.sh "${{ steps.apk.outputs.path }}" "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence-${{ matrix.variant }}
          path: |
            flow-artifacts
            test-addon.log
            mock-llm.log
          retention-days: 14
